name: Build exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller tkinterdnd2
      - run: pyinstaller --onefile --windowed --collect-all tkinterdnd2 --name TabletSpoofPatcher tablet_spoof_patcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: TabletSpoofPatcher
          path: dist/TabletSpoofPatcher.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/TabletSpoofPatcher.exe
